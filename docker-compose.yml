services:
  hub:
    build:
      context: .
      dockerfile: hub/Dockerfile
    image: satya16dev/sandboxhub-hub:latest
    container_name: sandboxhub-hub
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - SANDBOXHUB_NETWORK=sandboxhub-net
      - SANDBOXHUB_BIND_HOST=127.0.0.1
      - OAUTH_ADMIN_TOKEN=dev-admin-token
      - CHAOS_ADMIN_TOKEN=dev-admin-token
      - MOCK_ADMIN_TOKEN=dev-admin-token
      - GRAPHQL_ADMIN_TOKEN=dev-admin-token
    networks:
      - sandboxhub-net
    restart: unless-stopped

  # Not started by `docker compose up` (profile is never active) -- these
  # exist purely so `docker compose build` builds every image the hub needs
  # before it starts creating containers on demand.
  rest-api-image:
    build: ./resources/rest-api
    image: satya16dev/sandboxhub-rest-api:latest
    profiles: ["build-only"]

  mcp-server-image:
    build: ./resources/mcp-server
    image: satya16dev/sandboxhub-mcp-server:latest
    profiles: ["build-only"]

  oauth-provider-image:
    build: ./resources/oauth-provider
    image: satya16dev/sandboxhub-oauth-provider:latest
    profiles: ["build-only"]

  mock-api-image:
    build: ./resources/mock-api
    image: satya16dev/sandboxhub-mock-api:latest
    profiles: ["build-only"]

  graphql-api-image:
    build: ./resources/graphql-api
    image: satya16dev/sandboxhub-graphql-api:latest
    profiles: ["build-only"]

  webhook-receiver-image:
    build: ./resources/webhook-receiver
    image: satya16dev/sandboxhub-webhook-receiver:latest
    profiles: ["build-only"]

  chaos-api-image:
    build: ./resources/chaos-api
    image: satya16dev/sandboxhub-chaos-api:latest
    profiles: ["build-only"]

  api-tester-image:
    build: ./resources/api-tester
    image: satya16dev/sandboxhub-api-tester:latest
    profiles: ["build-only"]

networks:
  sandboxhub-net:
    name: sandboxhub-net
