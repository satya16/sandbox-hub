[pytest]
# Several resource directories under resources/ each have their own
# tests/test_*.py with overlapping basenames (test_auth.py, etc.) and no
# __init__.py -- pytest's default "prepend" import mode would raise "import
# file mismatch" the moment two of those get collected in the same session.
# importlib mode keys each test module by its own file path instead, so
# same-named files in different directories never collide.
addopts = --import-mode=importlib
